services:
  # Your NestJS Web Service
  - type: web
    name: my-vinyl-app
    env: node
    plan: free # Or your preferred plan
    buildCommand: 'npm install && npm run build'
    startCommand: 'npm run start:prod'
    healthCheckPath: /api/health # Add a health check endpoint for reliability
    envVars:
      - key: APP_TITLE
        value: VINYL STORE
      - key: APP_DESCRIPTION
        value: VINYL STORE APPLICATION
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: my-vinyl-db
          property: internalConnectionString
      - key: DISCOGS_USER_TOKEN
        sync: false
      # Security
      - key: JWT_SECRET
        sync: false
      - key: COOKIE_SECRET
        sync: false
      - key: ACCESS_EXPIRES_IN
        value: 1m
      - key: REFRESH_EXPIRES_IN
        value: 15m
      # Stripe
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # SSO GITHUB
      - key: SSO_GITHUB_CLIENT_ID
        sync: false
      - key: SSO_GITHUB_CLIENT_SECRET
        sync: false
      - key: SSO_GITHUB_CALLBACK_URL
        sync: false
      # SSO GOOGLE
      - key: SSO_GOOGLE_CLIENT_ID
        sync: false
      - key: SSO_GOOGLE_CLIENT_SECRET
        sync: false
      - key: SSO_GOOGLE_CALLBACK_URL
        sync: false
      # Mailer
      - key: GOOGLE_USERNAME
        sync: false
      - key: GOOGLE_APP_PASSWORD
        sync: false

  - type: pserv
    name: my-vinyl-db
    env: postgres
    plan: free
    postgresMajorVersion: 16
    disk:
      name: postgres-data
      sizeGB: 1
